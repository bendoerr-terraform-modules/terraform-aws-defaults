# 1-module shape for repos born from this template. See
# terraform-aws-fargate-on-demand's floor-check.yml for the multi-module reference.
name: Floor Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  floor:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Only MODULE ROOTS are init+validated. The examples/** floors are policed by
        # `convention` below (baseline-or-receipt) — examples are compositions.
        include:
          - { module: ".", tf: "1.3.0" }
    steps:
      - name: "Harden Runner"
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            checkpoint-api.hashicorp.com:443
            github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            registry.terraform.io:443
            release-assets.githubusercontent.com:443
            releases.hashicorp.com:443
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Assert matrix floor == module's declared required_version"
        working-directory: ${{ matrix.module }}
        run: |
          set -euo pipefail
          # Keep the matrix honest against versions.tf: a drifted matrix value would
          # silently test the wrong version. Fail loudly instead.
          # `|| true`: a no-match grep would abort under pipefail before the friendly error.
          declared=$(grep -oE 'required_version *= *">= [0-9]+\.[0-9]+\.[0-9]+"' versions.tf | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)
          if [ "$declared" != "${{ matrix.tf }}" ]; then
            echo "::error::floor-check matrix pins ${{ matrix.tf }} but ${{ matrix.module }}/versions.tf declares >= ${declared:-<none>} — update the matrix to match the declared floor"
            exit 1
          fi
          echo "matrix floor ${{ matrix.tf }} matches declared >= $declared"
      - name: "Setup Terraform (pinned to declared floor)"
        uses: step-security/setup-terraform@11f45fe036ccfd27d231861d38b183d405b059a9 # v4.0.0
        with:
          terraform_version: ${{ matrix.tf }}
          terraform_wrapper: false
      - name: "Init + validate at exact floor"
        working-directory: ${{ matrix.module }}
        run: |
          terraform init -backend=false -input=false
          terraform validate

  convention:
    runs-on: ubuntu-latest
    steps:
      - name: "Harden Runner"
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Floors self-police: baseline silent, deviations documented"
        run: |
          set -euo pipefail
          # Every required_version must exactly match the ROOT module's declared floor OR
          # carry a "# floor-reason:" receipt. The baseline is derived, not hardcoded, so
          # the same check propagates to repos whose floor predates the template's 1.3.0.
          # NOTE: this makes the job an INTERNAL-CONSISTENCY gate, not a fleet minimum —
          # no org-wide floor is enforced here; that policy question lives elsewhere.
          # Subsumes "no stale floors" and "no ~> caps" and makes the convention executable
          # instead of advice.
          root=$(grep -oE 'required_version *= *">= [0-9]+\.[0-9]+\.[0-9]+"' versions.tf | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)
          if [ -z "$root" ]; then
            echo "::error::root versions.tf declares no three-part '>= x.y.z' required_version — the convention needs a root floor to derive its baseline"
            exit 1
          fi
          bad=$(grep -rn 'required_version' --include='*.tf' . \
            | grep -vE "required_version += +\">= ${root//./\\.}\"" \
            | grep -v 'floor-reason:' || true)
          if [ -n "$bad" ]; then
            echo "::error::each required_version must match the root floor '>= ${root}' or carry a '# floor-reason:' receipt"
            echo "$bad"
            exit 1
          fi
          echo "floors: root baseline >= ${root}; deviations documented"
