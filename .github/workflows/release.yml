# Thin caller -> reusable release publisher in bendoerr-terraform-modules/workflows (immutable SHA pin, dependabot-bumped).
# Tag trigger lives here (reusables are workflow_call-only). Job MUST grant contents:write +
# pull-requests:write (caller-capped) or the reusable can't publish the release / fetch changelog reviewers.
name: Publish release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
      pull-requests: write
    uses: bendoerr-terraform-modules/workflows/.github/workflows/release.yml@63ce31cf4d1506a783227a4eb44f6d24d299b776 # v1.2.8
